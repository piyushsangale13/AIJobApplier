services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-job-applier-postgres
    environment:
      POSTGRES_DB: ai_job_applier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai-job-applier-backend
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_job_applier
    volumes:
      - ../backend:/app
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-job-applier-frontend
    env_file:
      - ../frontend/.env.example
    volumes:
      - ../frontend:/app
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
