services:
  minio:
    image: minio/minio:latest
    container_name: ai-job-applier-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ai-job-applier-postgres
    environment:
      POSTGRES_DB: ai_job_applier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_job_applier"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres:16-alpine
    container_name: ai-job-applier-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ../db-init:/db-init:ro
    entrypoint:
      - /bin/sh
      - /db-init/init-db.sh
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai-job-applier-backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_job_applier
    volumes:
      - ../backend:/app
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-job-applier-frontend
    env_file:
      - ../frontend/.env.example
    volumes:
      - ../frontend:/app
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  minio_data:
